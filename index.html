<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Página com erros de acessibilidade</title>

<style>
/* contraste ruim */
.bad-contrast{
    color: #aaa;
    background-color: #bbb;
}

/* elemento clicável que não é botão */
.clickable{
    padding:10px;
    background:#ccc;
    cursor:pointer;
}
</style>

</head>

<body>

<h1>Teste de Acessibilidade</h1>

<!-- pular níveis de heading -->
<h4>Seção que pulou heading</h4>

<!-- imagem sem alt -->
<img src="praia.jpg" alt="Foto de uma praia com areia e mar">

<!-- imagem com alt vazio indevido -->
<img src="carro.jpg" alt="Foto de um carro esportivo vermelho">

<!-- link vazio -->
<a href="#">Texto visível ou aria-label</a>

<!-- link com texto ruim -->
<a href="#">clique aqui</a>

<!-- botão sem texto -->
<button type="button">Enviar</button>

<!-- div usada como botão -->
<button type="button" onclick="alert('clicou')">Enviar</button>
    Enviar
</div>

<!-- contraste ruim -->
<p class="bad-contrast">
Texto com contraste muito baixo
</p>

<!-- formulário sem label -->
<form>

<label for="nome">Nome</label><input type="text" id="nome">

<label for="email">Email</label><input type="email" id="email">

<label for="senha">Senha</label><input type="password" id="senha">

<button>Enviar</button>

</form>

<br>

<!-- tabela sem cabeçalho -->
<table border="1">
<tr>
<td>Nome</td>
<td>Idade</td>
</tr>

<tr>
<td>Murilo</td>
<td>25</td>
</tr>

<tr>
<td>Ana</td>
<td>30</td>
</tr>
</table>

<br>

<!-- iframe sem title -->
<iframe src="https://example.com"></iframe>

<br><br>

<!-- texto como imagem -->
<button aria-label="Comprar"><img src="botao-comprar.png" alt=""></button>

<!-- lista incorreta -->
<ul>
<div>Item 1</div>
<div>Item 2</div>
</ul>

<!-- campo obrigatório sem indicação -->
<label for="campo">Texto</label><input type="text" id="campo">

</body>
</html>
