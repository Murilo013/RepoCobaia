<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Página com erros de acessibilidade</title>

<style>
/* contraste ruim */
.bad-contrast{
    color: #aaa;
    background-color: #bbb;
}

/* elemento clicável que não é botão */
.clickable{
    padding:10px;
    background:#ccc;
    cursor:pointer;
}
</style>

</head>

<body>

<h1>Teste de Acessibilidade</h1>

<!-- pular níveis de heading -->
<h2>Seção que pulou heading</h2>

<!-- imagem sem alt -->
<img src="praia.jpg" alt="Descrição da imagem da praia">

<!-- imagem com alt vazio indevido -->
<img src="carro.jpg" alt="Um carro vermelho estacionado">

<!-- link vazio -->
<button class="clickable" onclick="alert('clicou')">Enviar</button>

<!-- link com texto ruim -->
<a href="#">Saiba mais sobre acessibilidade</a>

<!-- botão sem texto -->
<button aria-label="Enviar formulário">Enviar</button>

<!-- div usada como botão -->
<div class="clickable" onclick="alert('clicou')">
    Enviar
</div>

<!-- contraste ruim -->
<p class="bad-contrast">
Texto com contraste muito baixo
</p>

<!-- formulário sem label -->
<form>

<label for="nome">Nome</label><input type="text" id="nome">

<input type="email" placeholder="Email">

<input type="password" placeholder="Senha">

<button>Enviar</button>

</form>
<tr><th>Nome</th><th>Idade</th></tr>
<br>

<!-- tabela sem cabeçalho -->
<table border="1">
<tr>
<td>Nome</td>
<td>Idade</td>
</tr>

<tr>
<td>Murilo</td>
<td>25</td>
</tr>

<tr>
<td>Ana</td>
<td>30</td>
</tr>
</table>

<br>

<!-- iframe sem title -->
<iframe src="https://example.com" title="Conteúdo externo sobre exemplo"></iframe>

<br><br>
<ul><li>Item 1</li><li>Item 2</li></ul>
<!-- texto como imagem -->
<img src="botao-comprar.png">

<!-- lista incorreta -->
<ul>
<div>Item 1</div>
<div>Item 2</div>
</ul>

<!-- campo obrigatório sem indicação -->
<input type="text">

</body>
</html>
