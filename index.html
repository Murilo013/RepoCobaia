<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Página com erros de acessibilidade</title>

<style>
/* contraste ruim */
.bad-contrast{
    color: #aaa;
    background-color: #bbb;
}

/* elemento clicável que não é botão */
.clickable{
    padding:10px;
    background:#ccc;
    cursor:pointer;
}
</style>

</head>

<body>

<h1>Teste de Acessibilidade</h1>

<!-- pular níveis de heading -->
<h2>Seção que pulou heading</h2>

<!-- imagem sem alt -->
<img src="praia.jpg" alt="Descrição da imagem da praia">

<!-- imagem com alt vazio indevido -->
<img src="carro.jpg" alt="Descrição do carro">

<button type="button" class="clickable" onclick="alert('clicou')">Enviar</button>
<a href="#">Link para página externa</a>

<!-- link com texto ruim -->
<a href="#">Saiba mais sobre acessibilidade</a>

<p style="color: #000; background-color: #fff;">Texto com contraste adequado</p>
<button type="button">Enviar formulário</button>

<!-- div usada como botão -->
<div class="clickable" onclick="alert('clicou')">
    Enviar
</div>

<!-- contraste ruim -->
<p class="bad-contrast">
Texto com contraste muito baixo
</p>

<!-- formulário sem label -->
<form>

<label for="nome">Nome</label><input type="text" id="nome">

<table><thead><tr><th>Nome</th><th>Idade</th></tr></thead><tbody><tr><td>Murilo</td><td>25</td></tr></tbody></table>

<label for="senha">Senha</label><input type="password" id="senha">

<button>Enviar</button>

</form>

<br>

<!-- tabela sem cabeçalho -->
<table border="1">
<tr>
<td>Nome</td>
<td>Idade</td>
</tr>

<tr>
<td>Murilo</td>
<td>25</td>
</tr>

<tr>
<td>Ana</td>
<td>30</td>
</tr>
</table>
<ul><li>Item 1</li><li>Item 2</li></ul>
<br>

<!-- iframe sem title -->
<iframe src="https://example.com" title="Conteúdo externo sobre exemplo"></iframe>

<br><br>

<!-- texto como imagem -->
<img src="botao-comprar.png" alt="Comprar agora">

<!-- lista incorreta -->
<ul>
<div>Item 1</div>
<div>Item 2</div>
</ul>

<!-- campo obrigatório sem indicação -->
<label for="campo-input">Campo de texto</label><input type="text" id="campo-input">

</body>
</html>
